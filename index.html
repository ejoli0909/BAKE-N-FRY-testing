
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d92820">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>BAKE N FRY</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff9ed;color:#292522;font-family:Arial,sans-serif}
header{background:#d92820;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:23px;margin:0}
button{border:0;border-radius:10px;padding:12px;font-weight:bold;cursor:pointer}
.manage{background:#ffd43b}
main{max-width:850px;margin:auto;padding:18px}
.hero{background:#ffd43b;padding:22px;border-radius:18px;margin-bottom:20px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.product,.panel{background:white;padding:15px;border-radius:15px;border:1px solid #eee2d2}
.food{font-size:48px;text-align:center;background:#fff0c4;border-radius:12px;padding:12px}
.price{color:#d92820;font-weight:bold;margin:8px 0}
.add,.primary{background:#d92820;color:white;width:100%}
.panel{margin-top:20px}
input{width:100%;padding:13px;margin:6px 0 12px;border:1px solid #ccc;border-radius:9px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.hidden{display:none}
.total{font-size:20px;font-weight:bold;display:flex;justify-content:space-between;padding:15px 0}
.muted{color:#766f68;font-size:13px}
.order{background:#fff5d9;padding:12px;border-radius:12px;margin:12px 0}
@media(min-width:600px){.products{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
<div><h1>BAKE N FRY</h1><small>FRESHLY BAKED • MADE WITH LOVE</small></div>
<button class="manage" onclick="showManage()">MANAGE</button>
</header>
<main>
<section id="shop">
<div class="hero">
<h2>Freshly baked favorites, just a tap away.</h2>
<p>Choose your treats and place your order with BAKE N FRY.</p>
</div>
<h2>Our Products</h2>
<div class="products" id="products"></div>
<div class="panel">
<h2>Your Cart</h2>
<div id="cart">Your cart is empty.</div>
<div class="total"><span>Total</span><span id="total">₱0.00</span></div>
<button class="primary" onclick="checkout()">PROCEED TO CHECKOUT</button>
</div>
<div class="panel hidden" id="checkoutPanel">
<h2>Customer Details</h2>
<form id="orderForm">
<label>Name</label><input id="name" required>
<label>Address</label><input id="address" required>
<label>Contact Number</label><input id="phone" type="tel" required>
<button class="primary">PLACE ORDER</button>
</form>
</div>
</section>
<section id="manage" class="hidden">
<h2>Manage Orders</h2>
<button onclick="showShop()">BACK TO SHOP</button>
<div id="orders"></div>
</section>
</main>
<script>
const products=[
{name:"Ensaymada",price:45,emoji:"🧁"},
{name:"Pan de Sal",price:5,emoji:"🥖"},
{name:"Pan de Coco",price:12,emoji:"🥥"},
{name:"Kababayan",price:10,emoji:"🧁"},
{name:"Spanish Bread",price:12,emoji:"🥐"},
{name:"Chocolate Cupcake",price:25,emoji:"🧁"}
];
let cart={};
const money=n=>"₱"+n.toFixed(2);
function renderProducts(){
document.getElementById("products").innerHTML=products.map((p,i)=>`
<div class="product">
<div class="food">${p.emoji}</div>
<h3>${p.name}</h3>
<div class="price">${money(p.price)}</div>
<button class="add" onclick="add(${i})">ADD TO CART</button>
</div>`).join("");
}
function add(i){cart[i]=(cart[i]||0)+1;renderCart()}
function renderCart(){
let entries=Object.entries(cart).filter(([i,q])=>q>0);
let total=entries.reduce((s,[i,q])=>s+products[i].price*q,0);
document.getElementById("cart").innerHTML=entries.length?entries.map(([i,q])=>`
<div class="row"><span>${products[i].name} × ${q}</span>
<span><button onclick="change(${i},-1)">−</button>
<button onclick="change(${i},1)">+</button>
${money(products[i].price*q)}</span></div>`).join(""):"Your cart is empty.";
document.getElementById("total").textContent=money(total);
}
function change(i,n){cart[i]=Math.max(0,(cart[i]||0)+n);renderCart()}
function checkout(){
if(!Object.values(cart).some(q=>q>0)){alert("Your cart is empty.");return}
document.getElementById("checkoutPanel").classList.remove("hidden");
}
function getOrders(){return JSON.parse(localStorage.getItem("bnf_orders")||"[]")}
document.getElementById("orderForm").onsubmit=function(e){
e.preventDefault();
let orders=getOrders();
let items=Object.entries(cart).filter(([i,q])=>q>0).map(([i,q])=>({name:products[i].name,qty:q,price:products[i].price}));
let order={id:"BNF-"+(orders.length+1),name:document.getElementById("name").value,address:document.getElementById("address").value,phone:document.getElementById("phone").value,items,status:"Pending",date:new Date().toLocaleString()};
orders.push(order);
localStorage.setItem("bnf_orders",JSON.stringify(orders));
alert("Order submitted! Order number: "+order.id);
cart={};renderCart();this.reset();
document.getElementById("checkoutPanel").classList.add("hidden");
};
function showManage(){
document.getElementById("shop").classList.add("hidden");
document.getElementById("manage").classList.remove("hidden");
renderOrders();
}
function showShop(){
document.getElementById("manage").classList.add("hidden");
document.getElementById("shop").classList.remove("hidden");
}
function renderOrders(){
let orders=getOrders();
document.getElementById("orders").innerHTML=orders.length?orders.slice().reverse().map(o=>`
<div class="order"><h3>${o.id} — ${o.status}</h3>
<b>${o.name}</b><p>${o.address}</p><p>${o.phone}</p>
${o.items.map(i=>`<div class="row">${i.name} × ${i.qty}<b>${money(i.price*i.qty)}</b></div>`).join("")}
</div>`).join(""):"No orders yet.";
}
renderProducts();renderCart();
if("serviceWorker" in navigator){
navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
}
</script>
</body>
</html>
